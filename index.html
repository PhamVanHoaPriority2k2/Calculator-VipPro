<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Khóa Zoom ở cấp độ Viewport trên thiết bị di động -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Phạm Văn Hoà Priority Calculator</title>
<style>
    /* Khóa hoàn toàn mọi thao tác cuộn/phóng to thu nhỏ bằng CSS */
    html, body {
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        overflow: hidden;
        height: 100%;
        width: 100%;
    }

    * {
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
    }

    :root {
        --bg-color: #e9e9e9;
        --casing-bg: #2b55b3;
        --face-bg: #fcfcfc;
        --screen-bg: #e5ecd9;
        --screen-text: #222222;
        --num-btn-bg: #ffffff;
        --num-btn-text: #000000;
        --drawer-bg: rgba(255, 255, 255, 0.98);
        --num-glow: rgba(0, 122, 255, 0.8);
        --theme-btn-bg: #ffffff;
        --theme-btn-text: #000000;
        --btn-border: #cccccc;
        --close-icon-color: #333333;
    }

    body.dark-mode {
        --bg-color: #000000;
        --casing-bg: #0d0d0d;
        --face-bg: #000000;
        --screen-bg: #ffffff;
        --screen-text: #000000;
        --num-btn-bg: #1a1a1a;
        --num-btn-text: #ffffff;
        --drawer-bg: #0a0a0a;
        --num-glow: rgba(255, 255, 255, 0.8);
        --theme-btn-bg: #222222;
        --theme-btn-text: #ffffff;
        --btn-border: #444444;
        --close-icon-color: #ffffff;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        background-color: var(--bg-color);
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: background-color 0.3s ease;
    }

    .device-casing {
        background-color: var(--casing-bg);
        border-radius: 20px;
        padding: 6px;
        box-shadow: 5px 15px 25px rgba(0,0,0,0.5), inset -3px -3px 10px rgba(0,0,0,0.3);
        width: 335px;
        max-width: 92vw;
        position: relative;
        margin: auto;
    }

    .device-face {
        background-color: var(--face-bg);
        border-radius: 16px;
        padding: 14px 10px 16px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .logo-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 95%;
        margin-bottom: 10px;
    }

    .brand-group {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .logo {
        font-size: 11px;
        font-weight: 800;
    }

    .logo.status-on { color: #28a745; }
    .logo.status-off { color: #dc3545; }

    .theme-btn {
        background-color: var(--theme-btn-bg);
        color: var(--theme-btn-text);
        border: 1px solid #777;
        font-size: 9px;
        font-weight: 900;
        cursor: pointer;
        padding: 3px 5px;
        border-radius: 4px;
    }

    .power-btn {
        background-color: #333;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 3px 7px;
        font-size: 10px;
        font-weight: 900;
        cursor: pointer;
    }

    .screen-container {
        width: 95%;
        height: 70px;
        background-color: var(--screen-bg);
        border-radius: 6px;
        box-shadow: inset 2px 3px 5px rgba(0,0,0,0.3);
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 4px 10px;
    }

    .screen-tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        font-size: 11px;
        color: var(--screen-text);
    }

    .expression-text {
        font-family: monospace;
        font-size: 11px;
        color: #666;
        height: 14px;
        overflow: hidden;
    }

    .screen-text {
        text-align: right;
        font-family: 'Courier New', monospace;
        font-size: 24px;
        font-weight: 900;
        color: var(--screen-text);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .device-face.is-off .screen-container { background-color: #050505 !important; }
    .device-face.is-off .screen-text,
    .device-face.is-off .screen-tools,
    .device-face.is-off .expression-text { display: none !important; }

    .history-drawer {
        position: absolute;
        top: -100%;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--drawer-bg);
        z-index: 10;
        transition: top 0.3s ease;
        padding: 15px;
        display: flex;
        flex-direction: column;
    }

    .history-drawer.open { top: 0; }

    .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #444;
        padding-bottom: 8px;
        font-weight: 900;
        color: var(--num-btn-text);
    }

    .close-history-btn {
        color: var(--close-icon-color);
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
    }

    .clear-history-btn {
        background-color: #fa4252;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 900;
        cursor: pointer;
    }

    .history-list {
        flex: 1;
        overflow-y: auto;
        margin-top: 10px;
        font-family: monospace;
        font-size: 14px;
        color: var(--num-btn-text);
        touch-action: pan-y; /* Cho phép cuộn dọc riêng trong lịch sử */
    }

    .history-item {
        padding: 6px 0;
        border-bottom: 1px dashed #444;
        text-align: right;
    }

    .top-buttons {
        display: flex;
        width: 95%;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .top-btn {
        background-color: #2b55b3;
        color: white;
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 8px;
        padding: 8px 0;
        font-size: 20px;
        font-weight: 900;
        flex: 1;
        margin: 0 3px;
        box-shadow: 2px 3px 5px rgba(0,0,0,0.4);
        cursor: pointer;
        transition: transform 0.05s, box-shadow 0.05s, background-color 0.2s;
    }

    .top-btn.active-op {
        background-color: #00d2ff !important;
        color: #000 !important;
        box-shadow: 0 0 12px #00d2ff, 0 0 20px #00d2ff !important;
        transform: scale(0.96);
    }

    .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr) 1.2fr;
        gap: 10px;
        width: 95%;
    }

    .num-btn {
        background-color: var(--num-btn-bg);
        color: var(--num-btn-text);
        border: 2px solid var(--btn-border);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 22px;
        font-weight: 900;
        display: flex;
        justify-content: center;
        align-items: center;
        justify-self: center;
        box-shadow: 2px 3px 6px rgba(0,0,0,0.3);
        cursor: pointer;
    }

    .act-btn {
        border-radius: 8px;
        width: 54px;
        height: 48px;
        font-size: 22px;
        font-weight: 900;
        display: flex;
        justify-content: center;
        align-items: center;
        justify-self: end;
        box-shadow: 2px 3px 6px rgba(0,0,0,0.3);
        cursor: pointer;
        color: white;
    }

    .btn-red { background-color: #fa4252; }
    .btn-yellow { background-color: #fade2a; color: #000; }
    .btn-green { background-color: #31c98e; }

    .btn-pressed {
        transform: scale(0.92) translateY(2px) !important;
        box-shadow: 0 0 15px var(--num-glow) !important;
    }
</style>
</head>
<body>

<div class="device-casing">
    <div class="device-face" id="deviceFace">
        
        <div class="history-drawer" id="historyDrawer">
            <div class="history-header">
                <span>Lịch Sử Phép Tính</span>
                <button class="clear-history-btn" id="btnClearHistory">Xóa tất cả</button>
                <span class="close-history-btn" id="closeHistory">✕</span>
            </div>
            <div class="history-list" id="historyList">
                <div style="text-align: center; color: #888; margin-top: 20px;">Chưa có lịch sử</div>
            </div>
        </div>

        <div class="logo-container">
            <div class="brand-group">
                <div class="logo status-on" id="brandLogo">Phạm Văn Hoà Priority 🇻🇳</div>
                <button class="theme-btn" id="btnTheme">Chế độ Tối</button>
            </div>
            <button class="power-btn" id="powerBtn">OFF</button>
        </div>

        <div class="screen-container">
            <div class="screen-tools">
                <span style="cursor:pointer;" id="btnHistory">↺ Lịch sử</span>
                <span class="expression-text" id="expression"></span>
            </div>
            <div class="screen-text" id="display">0</div>
        </div>
        
        <div class="top-buttons">
            <button class="top-btn" data-action="op" data-value="+">+</button>
            <button class="top-btn" data-action="op" data-value="-">-</button>
            <button class="top-btn" data-action="op" data-value="×">×</button>
            <button class="top-btn" data-action="op" data-value="÷">÷</button>
        </div>

        <div class="keypad">
            <button class="num-btn" data-action="num" data-value="1">1</button>
            <button class="num-btn" data-action="num" data-value="2">2</button>
            <button class="num-btn" data-action="num" data-value="3">3</button>
            <button class="act-btn btn-red" data-action="clear">X</button>

            <button class="num-btn" data-action="num" data-value="4">4</button>
            <button class="num-btn" data-action="num" data-value="5">5</button>
            <button class="num-btn" data-action="num" data-value="6">6</button>
            <button class="act-btn btn-yellow" data-action="delete">⌫</button>

            <button class="num-btn" data-action="num" data-value="7">7</button>
            <button class="num-btn" data-action="num" data-value="8">8</button>
            <button class="num-btn" data-action="num" data-value="9">9</button>
            <button class="act-btn btn-green" data-action="equals">=</button>

            <button class="num-btn" data-action="num" data-value=".">.</button>
            <button class="num-btn" data-action="num" data-value="0">0</button>
            <div></div>
            <div></div>
        </div>
    </div>
</div>

<script>
    // --- BỘ CHẶN PHÓNG TO THU NHỎ (PREVENT ZOOM JAVASCRIPT) ---
    // 1. Chặn phóng to bằng cách chụm 2 ngón tay (Pinch Zoom)
    document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    // 2. Chặn phóng to khi nhấp đúp liên tục (Double tap to zoom)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    // 3. Chặn cuộn phím Ctrl + lăn chuột hoặc Ctrl + dấu +/- trên bàn phím máy tính
    document.addEventListener('wheel', function(event) {
        if (event.ctrlKey) {
            event.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('keydown', function(event) {
        if (event.ctrlKey && (event.key === '+' || event.key === '-' || event.key === '=')) {
            event.preventDefault();
        }
    });

    // --- XỬ LÝ MÁY TÍNH ---
    const display = document.getElementById('display');
    const expressionEl = document.getElementById('expression');
    const deviceFace = document.getElementById('deviceFace');
    const brandLogo = document.getElementById('brandLogo');
    const powerBtn = document.getElementById('powerBtn');
    const btnTheme = document.getElementById('btnTheme');
    const btnHistory = document.getElementById('btnHistory');
    const closeHistory = document.getElementById('closeHistory');
    const btnClearHistory = document.getElementById('btnClearHistory');
    const historyDrawer = document.getElementById('historyDrawer');
    const historyList = document.getElementById('historyList');
    const opButtons = document.querySelectorAll('.top-btn');

    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let shouldResetDisplay = false;
    let isPowerOn = true;
    let historyData = [];

    function clearOpHighlights() {
        opButtons.forEach(btn => btn.classList.remove('active-op'));
    }

    function updateDisplay(val) {
        display.innerText = val !== undefined ? val : currentInput;
    }

    function appendNum(number) {
        if (!isPowerOn) return;
        clearOpHighlights();
        
        if (currentInput === '0' || shouldResetDisplay) {
            currentInput = (number === '.') ? '0.' : number;
            shouldResetDisplay = false;
        } else {
            if (number === '.' && currentInput.includes('.')) return;
            if (currentInput.length < 10) {
                currentInput += number;
            }
        }
        updateDisplay();
    }

    function setOperator(op, btnElement) {
        if (!isPowerOn) return;
        clearOpHighlights();
        if (btnElement) btnElement.classList.add('active-op');

        if (operator !== null && !shouldResetDisplay) {
            calculate(false);
        }
        previousInput = currentInput;
        operator = op;
        expressionEl.innerText = `${previousInput} ${operator}`;
        shouldResetDisplay = true;
    }

    function calculate(isEqualsPressed = true) {
        if (!isPowerOn || operator === null) return;

        let result;
        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);

        if (isNaN(prev) || isNaN(current)) return;

        switch (operator) {
            case '+': result = prev + current; break;
            case '-': result = prev - current; break;
            case '×': result = prev * current; break;
            case '÷': result = current === 0 ? 'Error' : prev / current; break;
            default: return;
        }

        if (result !== 'Error') {
            result = Math.round(result * 1000000) / 1000000;
            const fullExpr = `${previousInput}${operator}${currentInput}=${result}`;
            
            if (isEqualsPressed) {
                expressionEl.innerText = `${previousInput} ${operator} ${currentInput} =`;
                updateDisplay(fullExpr);
                addHistory(fullExpr);
                clearOpHighlights();
                operator = null;
            } else {
                expressionEl.innerText = `${result} ${operator}`;
                updateDisplay(result.toString());
            }
        } else {
            updateDisplay('Error');
        }

        currentInput = result.toString();
        shouldResetDisplay = true;
    }

    function clearAll() {
        if (!isPowerOn) return;
        currentInput = '0';
        previousInput = '';
        operator = null;
        shouldResetDisplay = false;
        expressionEl.innerText = '';
        clearOpHighlights();
        updateDisplay();
    }

    function deleteLast() {
        if (!isPowerOn || shouldResetDisplay) return;
        if (currentInput.length === 1 || currentInput === 'Error') {
            currentInput = '0';
        } else {
            currentInput = currentInput.slice(0, -1);
        }
        updateDisplay();
    }

    function addHistory(record) {
        historyData.unshift(record);
        renderHistory();
    }

    function renderHistory() {
        if (historyData.length === 0) {
            historyList.innerHTML = '<div style="text-align: center; color: #888; margin-top: 20px;">Chưa có lịch sử</div>';
            return;
        }
        historyList.innerHTML = historyData.map(item => `
            <div class="history-item">
                <div style="font-weight:900; font-size:16px;">${item}</div>
            </div>
        `).join('');
    }

    btnClearHistory.addEventListener('click', () => {
        historyData = [];
        renderHistory();
    });

    btnHistory.addEventListener('click', () => historyDrawer.classList.add('open'));
    closeHistory.addEventListener('click', () => historyDrawer.classList.remove('open'));

    powerBtn.addEventListener('click', () => {
        isPowerOn = !isPowerOn;
        if (isPowerOn) {
            deviceFace.classList.remove('is-off');
            brandLogo.classList.replace('status-off', 'status-on');
            powerBtn.innerText = 'OFF';
            clearAll();
        } else {
            deviceFace.classList.add('is-off');
            brandLogo.classList.replace('status-on', 'status-off');
            powerBtn.innerText = 'ON';
            historyDrawer.classList.remove('open');
        }
    });

    btnTheme.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        btnTheme.innerText = document.body.classList.contains('dark-mode') ? 'Chế độ Sáng' : 'Chế độ Tối';
    });

    const buttons = document.querySelectorAll('button');
    buttons.forEach(btn => {
        if (btn.id === 'powerBtn' || btn.classList.contains('theme-btn') || btn.classList.contains('clear-history-btn')) return;

        const handlePress = (e) => {
            e.preventDefault();
            btn.classList.add('btn-pressed');

            const action = btn.getAttribute('data-action');
            const value = btn.getAttribute('data-value');

            if (action === 'num') appendNum(value);
            else if (action === 'op') setOperator(value, btn);
            else if (action === 'clear') clearAll();
            else if (action === 'delete') deleteLast();
            else if (action === 'equals') calculate(true);
        };

        const handleRelease = () => btn.classList.remove('btn-pressed');

        btn.addEventListener('pointerdown', handlePress);
        btn.addEventListener('pointerup', handleRelease);
        btn.addEventListener('pointerleave', handleRelease);
    });
</script>

</body>
</html>
